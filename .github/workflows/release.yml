# Publicación: al subir una etiqueta v* (o a mano, sin publicar) genera todos los paquetes,
# los firma si hay secretos, calcula SHA-256, genera un SBOM y los adjunta a la Release.
#
# Secretos opcionales (sin ellos los paquetes salen sin firmar):
#   Windows (PFX):    WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PFX_PASSWORD
#   Windows (Azure Artifact Signing, antes Trusted Signing): AZURE_TENANT_ID,
#                     AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT,
#                     AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#   macOS:            MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD (Developer ID Application),
#                     MACOS_INSTALLER_CERT_P12_BASE64, MACOS_INSTALLER_CERT_PASSWORD
#                     (Developer ID Installer), APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID,
#                     APPLE_API_ISSUER_ID (notarización)
#   Linux:            LINUX_GPG_PRIVATE_KEY, LINUX_GPG_PASSPHRASE (firma de SHA256SUMS)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  AUTOFIRMA_BUILD_NUMBER: ${{ github.run_number }}
  # Aviso de nueva versión: las compilaciones publicadas consultan las versiones
  # de este mismo repositorio (sin esta variable la comprobación se desactiva).
  AUTOFIRMA_RELEASES_API: https://api.github.com/repos/${{ github.repository }}/releases/latest

jobs:
  meta:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Comprobar que la etiqueta coincide con Cargo.toml
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p}' Cargo.toml | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de Cargo.toml"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4,cargo-deb@3.8.0,cargo-generate-rpm@0.21.0
      - name: Herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev desktop-file-utils appstream
      - name: Paquetes (.deb, .rpm, .tar.gz, AppImage) con glibc >= 2.28
        run: tools/package/linux.sh --builder zigbuild --glibc 2.28 --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    env:
      HAS_PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
      HAS_AZURE: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Compilar
        shell: pwsh
        run: |
          cargo build --release --locked -p autofirma --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item target/${{ matrix.target }}/release/autofirma.exe bin/
          if (Test-Path target/${{ matrix.target }}/release/autofirma-cli.exe) {
            Copy-Item target/${{ matrix.target }}/release/autofirma-cli.exe bin/
          }

      # Firma de los ejecutables antes de empaquetarlos (PFX o Azure Artifact Signing).
      - name: Firmar ejecutables (PFX)
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: tools/package/sign-windows.ps1 -Files (Get-ChildItem bin/*.exe).FullName
      - name: Firmar ejecutables (Azure Artifact Signing)
        if: env.HAS_PFX != 'true' && env.HAS_AZURE == 'true'
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: AutoFirma
          description-url: https://github.com/autofirma-rs/autofirma-rs

      - name: Empaquetar (ZIP portable y MSI)
        shell: pwsh
        run: tools/package/windows.ps1 -Exe bin/autofirma.exe -Arch ${{ matrix.arch }} -OutDir dist -BuildNumber $env:AUTOFIRMA_BUILD_NUMBER

      - name: Firmar MSI (PFX)
        if: env.HAS_PFX == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: tools/package/sign-windows.ps1 -Files (Get-ChildItem dist/*.msi).FullName
      - name: Firmar MSI (Azure Artifact Signing)
        if: env.HAS_PFX != 'true' && env.HAS_AZURE == 'true'
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: AutoFirma
          description-url: https://github.com/autofirma-rs/autofirma-rs

      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: meta
    runs-on: macos-latest
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_MACOS_INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal
      - name: Llavero temporal con los certificados de firma
        if: env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/autofirma-signing.keychain-db"
          kc_pass="$(openssl rand -base64 24)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          if [ "$HAS_MACOS_INSTALLER_CERT" = true ]; then
            echo "$MACOS_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$MACOS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          fi
          rm -f "$RUNNER_TEMP"/*.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          app_id="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          inst_id="$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -n 1)"
          {
            echo "MACOS_KEYCHAIN=$keychain"
            echo "MACOS_SIGN_IDENTITY=$app_id"
            if [ -n "$inst_id" ]; then echo "MACOS_INSTALLER_IDENTITY=$inst_id"; fi
          } >> "$GITHUB_ENV"
      - name: Clave de notarización
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Paquetes (.app universal, .dmg y .pkg)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: tools/package/macos.sh --out dist
      - name: Limpiar llavero y clave
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publicar
    needs: [meta, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_GPG: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/autofirma-rs-${{ needs.meta.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sumas SHA-256
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Firmar SHA256SUMS (GPG)
        if: env.HAS_GPG == 'true'
        working-directory: dist
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          rm -rf "$GNUPGHOME"
      - name: Atestación de procedencia (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
      - name: Release de GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
