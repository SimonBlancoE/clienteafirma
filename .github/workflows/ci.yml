# Integración continua: formato, clippy y pruebas en Linux, Windows y macOS, y
# comprobación de los ficheros de empaquetado.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Solo números de línea en las compilaciones de depuración: los binarios de
  # prueba con información completa agotan el disco de los runners.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Formato (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Clippy y pruebas (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Liberar espacio (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Solo la rama principal guarda la caché; las PR la reutilizan.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Pruebas
        run: cargo test --workspace --locked --no-fail-fast

  integration:
    name: Integración real con el sistema (${{ matrix.os }})
    timeout-minutes: 60
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Compilar
        run: cargo build --release --locked -p autofirma
      - name: Instalar (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo target/release/autofirma install --system
          sudo target/release/autofirma doctor --json | tee doctor.json > /dev/null
          test -f /usr/local/share/ca-certificates/Autofirma_ROOT.crt
      - name: Instalar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Resolve-Path target\release\autofirma.exe
          Start-Process -FilePath $exe -ArgumentList 'install','--system' -Wait -NoNewWindow
          Start-Process -FilePath $exe -ArgumentList 'doctor','--json' -Wait -NoNewWindow -RedirectStandardOutput doctor.json
          if (-not (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Subject -like '*Autofirma ROOT*')) {
            throw 'La CA no está en LocalMachine\Root'
          }
          (Get-ItemProperty 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\afirma\shell\open\command').'(default)'
      - name: Instalar (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo target/release/autofirma install --system
          target/release/autofirma doctor --json > doctor.json
          security find-certificate -c "Autofirma ROOT" /Library/Keychains/System.keychain > /dev/null
      - name: Comprobar el diagnóstico
        run: python3 tools/ci/check_doctor.py doctor.json
      - name: Firmar y verificar por línea de comandos
        shell: bash
        run: |
          exe=target/release/autofirma
          [ -f "$exe.exe" ] && exe="$exe.exe"
          for f in cades xades pades; do
            in=testdata/pki/ca.crt; [ $f = pades ] && in=testdata/pades/rotated_pages.pdf
            "$exe" sign -i "$in" -o "firma-$f" -format "$f" \
              -store pkcs12:testdata/pki/firmante-rsa.p12 -password 12341234 -alias firmante-rsa | tee salida.txt
            test -s "firma-$f"
            "$exe" verify -i "firma-$f" | tee verificacion.txt
          done
      - name: Desinstalar
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) target/release/autofirma.exe uninstall --system ;;
            *) sudo target/release/autofirma uninstall --system ;;
          esac

  packaging:
    name: Ficheros de empaquetado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils appstream libxml2-utils
      - name: shellcheck
        run: |
          shellcheck tools/package/*.sh
          shellcheck -s sh packaging/common/configure-hook.sh packaging/linux/autofirma-wrapper.sh \
            packaging/linux/appimage/AppRun packaging/linux/debian/* packaging/linux/rpm/*.sh \
            packaging/macos/scripts/postinstall packaging/macos/uninstall.sh
      - name: Escritorio Linux (.desktop y AppStream)
        run: |
          desktop-file-validate packaging/linux/autofirma.desktop
          appstreamcli validate --no-net packaging/linux/io.github.autofirma_rs.AutoFirma.metainfo.xml
      - name: XML (WiX, manifiesto de Windows, plist de macOS)
        run: |
          xmllint --noout packaging/windows/*.wxs packaging/windows/*.wxi packaging/windows/wixl/*.wxs \
            packaging/windows/autofirma.exe.manifest packaging/macos/*.plist packaging/macos/*.xml
          python3 -I -c 'import plistlib,sys; [plistlib.load(open(f,"rb")) for f in sys.argv[1:]]' \
            packaging/macos/Info.plist packaging/macos/entitlements.plist packaging/macos/component.plist
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
