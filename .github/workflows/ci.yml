# Integración continua: formato, clippy y pruebas en Linux, Windows y macOS, y
# comprobación de los ficheros de empaquetado.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Solo números de línea en las compilaciones de depuración: los binarios de
  # prueba con información completa agotan el disco de los runners.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Formato (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Clippy y pruebas (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Liberar espacio (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Solo la rama principal guarda la caché; las PR la reutilizan.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Pruebas
        run: cargo test --workspace --locked --no-fail-fast

  integration:
    name: Integración real con el sistema (${{ matrix.os }})
    timeout-minutes: 60
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Compilar
        run: cargo build --release --locked -p autofirma
      - name: Instalar (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo target/release/autofirma install --system
          sudo target/release/autofirma doctor --json | tee doctor.json > /dev/null
          test -f /usr/local/share/ca-certificates/Autofirma_ROOT.crt
      - name: Instalar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Resolve-Path target\release\autofirma.exe
          Start-Process -FilePath $exe -ArgumentList 'install','--system' -Wait -NoNewWindow
          Start-Process -FilePath $exe -ArgumentList 'doctor','--json' -Wait -NoNewWindow -RedirectStandardOutput doctor.json
          if (-not (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Subject -like '*Autofirma ROOT*')) {
            throw 'La CA no está en LocalMachine\Root'
          }
          (Get-ItemProperty 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\afirma\shell\open\command').'(default)'
      - name: Instalar (macOS, paquete .pkg)
        if: runner.os == 'macOS'
        run: |
          # El .pkg real (sin firmar): su postinstall ejecuta `install --system`.
          tools/package/macos.sh --binary target/release/autofirma --no-dmg --out dist
          sudo installer -pkg dist/AutoFirma-*.pkg -target /
          # Si algo falla: qué hizo el postinstall y qué dice el diagnóstico.
          trap 'echo "--- install.log"; grep -i -A3 "autofirma\|postinstall" /var/log/install.log | tail -60; [ -f doctor.json ] && cat doctor.json' ERR
          set -x
          app=/Applications/AutoFirma.app/Contents/MacOS/autofirma
          test -x "$app"
          "$app" doctor --json > doctor.json
          security find-certificate -c "Autofirma ROOT" /Library/Keychains/System.keychain > /dev/null
          echo "AF_BIN=$app" >> "$GITHUB_ENV"
      - name: Comprobar el diagnóstico
        run: python3 tools/ci/check_doctor.py doctor.json
      - name: Firmar y verificar por línea de comandos
        shell: bash
        run: |
          exe=${AF_BIN:-target/release/autofirma}
          [ -f "$exe.exe" ] && exe="$exe.exe"
          for f in cades xades pades; do
            in=testdata/pki/ca.crt; [ $f = pades ] && in=testdata/pades/rotated_pages.pdf
            "$exe" sign -i "$in" -o "firma-$f" -format "$f" \
              -store pkcs12:testdata/pki/firmante-rsa.p12 -password 12341234 -alias firmante-rsa | tee salida.txt
            test -s "firma-$f"
            "$exe" verify -i "firma-$f" | tee verificacion.txt
          done
      - name: Firma desde una página web (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          certutil -f -user -p 12341234 -importpfx testdata\pki\firmante-rsa.p12 NoRoot
          [Environment]::SetEnvironmentVariable('AUTOFIRMA_LOG', 'debug', 'User')
          python tools/ci/web_sign.py target\release\autofirma.exe web
      - name: Abrir un fichero desde el Finder (macOS)
        if: runner.os == 'macOS'
        run: |
          # La aplicación recién lanzada con un documento (evento «odoc», que AppKit entrega
          # antes de terminar el arranque) lo recibe y la interfaz sigue en marcha.
          log="$HOME/.afirma/AutoFirma-rs.log"
          open -a /Applications/AutoFirma.app testdata/pades/rotated_pages.pdf
          for _ in $(seq 60); do
            grep -q 'Petición de apertura: File(".*rotated_pages.pdf")' "$log" 2>/dev/null && break
            sleep 1
          done
          grep 'Petición de apertura: File' "$log"
          sleep 5
          if grep -q 'Error interno' "$log"; then
            grep -A5 'Error interno' "$log"
            exit 1
          fi
          pgrep -f AutoFirma.app/Contents/MacOS/autofirma
          pkill -f AutoFirma.app/Contents/MacOS/autofirma
      - name: Firma desde una página web (macOS)
        if: runner.os == 'macOS'
        run: |
          # Llavero propio con el certificado de prueba, accesible sin preguntar.
          security create-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          security unlock-keychain -p ci ci.keychain
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086 # una ruta por palabra
          security list-keychains -d user -s ci.keychain $existing
          # La herramienta security no admite el PKCS#12 moderno (AES y MAC SHA-256).
          security import testdata/pki/firmante-rsa-legacy.p12 -k ci.keychain -P 12341234 -A
          # Sin preguntar al firmar: la app (firma ad hoc, sin equipo) se identifica por su cdhash.
          cdhash=$(codesign -dvvv /Applications/AutoFirma.app 2>&1 | sed -n 's/^CDHash=//p' | head -n 1)
          echo "cdhash de la app: $cdhash"
          security set-key-partition-list -S "apple-tool:,apple:,unsigned:,cdhash:$cdhash" -s -k ci ci.keychain > /dev/null
          /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate --getstealthmode --getblockall || true
          # Registro detallado también para la app que abre LaunchServices.
          launchctl setenv AUTOFIRMA_LOG debug
          python3 tools/ci/web_sign.py "$AF_BIN" web
      - name: Registro de AutoFirma (si algo falla)
        if: failure()
        shell: bash
        run: |
          for f in "$HOME/.afirma/AutoFirma-rs.log" "$USERPROFILE/.afirma/AutoFirma-rs.log"; do
            [ -f "$f" ] && tail -n 400 "$f"
          done
          # Informes de cierre inesperado de macOS.
          for f in "$HOME"/Library/Logs/DiagnosticReports/autofirma*; do
            [ -f "$f" ] && { echo "--- $f"; head -c 6000 "$f"; }
          done
          exit 0
      - name: Desinstalar
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) target/release/autofirma.exe uninstall --system ;;
            *) sudo "${AF_BIN:-target/release/autofirma}" uninstall --system ;;
          esac

  packaging:
    name: Ficheros de empaquetado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils appstream libxml2-utils
      - name: shellcheck
        run: |
          shellcheck tools/package/*.sh tools/android/*.sh
          shellcheck -s sh packaging/common/configure-hook.sh packaging/linux/autofirma-wrapper.sh \
            packaging/linux/appimage/AppRun packaging/linux/debian/* packaging/linux/rpm/*.sh \
            packaging/macos/scripts/postinstall packaging/macos/uninstall.sh
      - name: Escritorio Linux (.desktop y AppStream)
        run: |
          desktop-file-validate packaging/linux/autofirma.desktop
          appstreamcli validate --no-net packaging/linux/io.github.autofirma_rs.AutoFirma.metainfo.xml
      - name: XML (WiX, manifiesto de Windows, plist de macOS)
        run: |
          xmllint --noout packaging/windows/*.wxs packaging/windows/*.wxi packaging/windows/wixl/*.wxs \
            packaging/windows/autofirma.exe.manifest packaging/macos/*.plist packaging/macos/*.xml
          python3 -I -c 'import plistlib,sys; [plistlib.load(open(f,"rb")) for f in sys.argv[1:]]' \
            packaging/macos/Info.plist packaging/macos/entitlements.plist packaging/macos/component.plist
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
