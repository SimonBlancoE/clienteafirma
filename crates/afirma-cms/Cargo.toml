[package]
name = "afirma-cms"
description = "Firmas CMS/PKCS#7 y CAdES, sellos de tiempo RFC 3161 y utilidades ASN.1 para AutoFirma-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["http"]
# Transporte HTTP(S) por defecto para las autoridades de sellado de tiempo.
http = ["dep:ureq"]

[dependencies]
afirma-core.workspace = true
thiserror.workspace = true
chrono.workspace = true
hex.workspace = true
base64.workspace = true
tracing.workspace = true
rand.workspace = true
zip.workspace = true
rsa.workspace = true
sha1.workspace = true
sha2.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
ecdsa.workspace = true
p12-keystore.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
afirma-keystores.workspace = true
rcgen.workspace = true
rustls.workspace = true
