[package]
name = "autofirma"
description = "AutoFirma-rs: cliente de firma electrónica (interfaz gráfica, línea de comandos y protocolo afirma://)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "autofirma"
path = "src/main.rs"

[dependencies]
afirma-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wgpu", "persistence", "wayland", "x11", "accesskit"] }
egui_extras = { version = "0.37", features = ["image"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
x509-parser.workspace = true
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
