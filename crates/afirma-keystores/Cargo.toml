[package]
name = "afirma-keystores"
description = "Almacenes de certificados de AutoFirma-rs: PKCS#12, PKCS#11 (DNIe, tarjetas), NSS (Firefox), Windows y macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
afirma-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
ring.workspace = true
rsa.workspace = true
sha1.workspace = true
sha2.workspace = true
md-5.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
ecdsa.workspace = true
p12-keystore.workspace = true
x509-parser.workspace = true
hex.workspace = true
base64.workspace = true
chrono.workspace = true
directories.workspace = true
cryptoki.workspace = true
# Mismas versiones que usa `cryptoki`; solo para llamadas que `cryptoki` no
# expone (C_Initialize con pReserved para NSS, inicio de sesión
# CKU_CONTEXT_SPECIFIC).
cryptoki-sys = "0.4"
libloading = "0.8"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Llavero (SecItemCopyMatching, SecKeyCreateSignature, SecTrust). Misma
# versión de core-foundation que usa security-framework 3.x (necesario para
# `CFType::downcast` de sus tipos).
security-framework = "3.7"
security-framework-sys = "2.17"
core-foundation = "0.10"

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
