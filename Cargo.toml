[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.92"
license = "GPL-2.0-or-later OR EUPL-1.1"
repository = "https://github.com/ctt-gob-es/clienteafirma"
authors = ["AutoFirma-rs contributors", "Gobierno de España (código original Java)"]

[workspace.dependencies]
# Crates internos
afirma-core = { path = "crates/afirma-core" }
afirma-cms = { path = "crates/afirma-cms" }
afirma-xml = { path = "crates/afirma-xml" }
afirma-pdf = { path = "crates/afirma-pdf" }
afirma-keystores = { path = "crates/afirma-keystores" }
afirma-signers = { path = "crates/afirma-signers" }
afirma-protocol = { path = "crates/afirma-protocol" }
afirma-system = { path = "crates/afirma-system" }
afirma-cli = { path = "crates/afirma-cli" }
afirma-hash = { path = "crates/afirma-hash" }
afirma-certval = { path = "crates/afirma-certval" }

# Utilidades
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
once_cell = "1"
regex = "1"
url = "2"
percent-encoding = "2"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
directories = "6"
tempfile = "3"

# Criptografía
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
md-5 = "0.10"
digest = "0.10"
ring = "0.17"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
p521 = { version = "0.13", features = ["ecdsa"] }
ecdsa = "0.16"
x509-parser = { version = "0.18", features = ["verify"] }
p12-keystore = "0.4"
des = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }

# XML / PDF
xot = "0.31"
lopdf = { version = "0.45", default-features = false, features = ["chrono"] }

# Red
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = "0.30"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy", "gzip"] }

# PKCS#11
cryptoki = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
